<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>oko.co.kr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Manrope:wght@200;500&family=Noto+Sans+KR:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0eee6}
#frame{position:fixed;inset:0;overflow:hidden;background:#f0eee6;font-family:Manrope,"Noto Sans KR",system-ui,sans-serif;color:#3d3929}
#sea{position:absolute;inset:0;width:100%;height:100%;animation:fade 1.6s ease both}
.glass{position:absolute;left:50%;top:50%;width:min(96vw,140vh);height:min(72vh,100vw);transform:translate(-50%,-50%);border-radius:50%;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:radial-gradient(closest-side,rgba(250,249,245,.88),rgba(250,249,245,.55) 62%,rgba(250,249,245,0));
  -webkit-mask-image:radial-gradient(closest-side,#000 58%,transparent);mask-image:radial-gradient(closest-side,#000 58%,transparent);
  animation:fade 1.6s .2s ease both}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;text-align:center;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.ui>*{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.pill{position:absolute;top:calc(env(safe-area-inset-top,0px) + 3vh);left:0;right:0;margin:0 auto;width:max-content;display:flex;align-items:center;gap:.6em;
  padding:.55em 1.3em;border-radius:999px;background:rgba(250,249,245,.85);border:1.5px solid rgba(61,57,41,.16);
  font-size:clamp(14px,2.4vh,26px);font-weight:500;animation-delay:.3s}
.pill svg{width:1.1em;height:1.1em}
.word{font-size:clamp(96px,min(34vw,30vh),420px);font-weight:200;letter-spacing:-.04em;padding-right:.04em;line-height:1;animation-delay:.5s}
.o{display:inline-block;animation:blink 8.6s infinite}
.chip{padding:.7em 1.7em;border-radius:999px;background:#3d3929;color:#f0eee6;font:500 clamp(16px,2.6vh,28px) "Geist Mono",monospace;animation-delay:.75s}
.contact{font-size:clamp(17px,3vh,34px);font-weight:500;color:#3d3929;text-decoration:none;border-bottom:1.5px solid rgba(61,57,41,.35);padding-bottom:.1em;animation-delay:.95s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.ui>*,#sea,.glass,.o{animation:none}}
</style>
</head>
<body>
<div id="frame">
  <canvas id="sea"></canvas>
  <div class="glass"></div>
  <div class="ui">
    <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>oko.co.kr</span></div>
    <div class="chip">domain for sale</div>
    <a class="contact" href="mailto:oladik@naver.com">구매 문의 oladik@naver.com</a>
  </div>
</div>
<script>
// Full-window scene: cells are screen-space, plants live on a virtual stage scaled to the window. Pure function of t, integer cycles per T → seamless loop.
const TAU=Math.PI*2,T=24/.7,w=TAU/T,SS=3;
const cv=document.getElementById("sea"),ctx=cv.getContext("2d");
const oc=document.createElement("canvas"),ox=oc.getContext("2d",{willReadFrequently:true});
const bg=document.createElement("canvas"),BG=[239,236,227];
let W,H,CW,CH,COLS,ROWS,K,VW,VH,dpr;
const hash=(a,b,c)=>{const h=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return h-Math.floor(h)};
const mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const lum=c=>(.299*c[0]+.587*c[1]+.114*c[2])/255;

function setup(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
 CW=Math.round(Math.max(9,Math.min(16,Math.min(W,H)/55)));CH=Math.round(CW*1.375);
 COLS=Math.ceil(W/CW);ROWS=Math.ceil(H/CH);
 K=Math.max(.3,Math.min(W,H)/1500);VW=W/K;VH=H/K;
 cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
 oc.width=COLS*SS;oc.height=ROWS*SS;bg.width=W;bg.height=H;
 const g=bg.getContext("2d"),gr=g.createLinearGradient(0,0,W*.5,H);
 gr.addColorStop(0,"#f5f3ec");gr.addColorStop(.5,"#efece3");gr.addColorStop(1,"#e8e4d8");
 g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle="rgba(61,57,41,.05)";
 for(let x=0;x<W;x+=CW)g.fillRect(x,0,1,H);for(let y=0;y<H;y+=CH)g.fillRect(0,y,W,1);
}

// ---------- plants, drawn in local virtual px ----------
const ell=(g,x,y,rx,ry,rot,fill)=>{g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU);g.fillStyle=fill;g.fill()};
function rose(g,s,t){const k=1+.04*Math.sin(w*3*t);g.scale(k,k);
 const C=["#a86a70","#bc8187","#cc9a9f","#dab0b4","#e6c6c9"];
 for(let r=0;r<5;r++){const R=s*(1-r*.17);g.save();g.rotate(r*.65);
  for(let p=0;p<6;p++){g.save();g.rotate(p*TAU/6);ell(g,R*.55,0,R*.48,R*.4,0,C[r]);g.restore()}g.restore()}
 g.strokeStyle="#9a6068";g.lineWidth=s*.035;g.beginPath();
 for(let a=0;a<14;a+=.2){const r=s*.03*a;g.lineTo(r*Math.cos(a),r*Math.sin(a))}g.stroke()}
function sun(g,s,t){const k=1+.03*Math.sin(w*3*t+1);g.scale(k,k);
 for(let ring=0;ring<2;ring++)for(let p=0;p<24;p++){g.save();g.rotate((p+ring*.5)*TAU/24);
  ell(g,s*(.78-ring*.1),0,s*(.3-ring*.04),s*.1,0,ring?"#efe0a6":"#e3cf88");g.restore()}
 const gr=g.createRadialGradient(0,0,0,0,0,s*.46);gr.addColorStop(0,"#7d6b4e");gr.addColorStop(1,"#a89272");
 ell(g,0,0,s*.46,s*.46,0,gr);g.fillStyle="#c9b78e";
 for(let n=1;n<46;n++){const a=n*2.39996,r=s*.063*Math.sqrt(n);g.beginPath();g.arc(r*Math.cos(a),r*Math.sin(a),s*.025,0,TAU);g.fill()}}
function leaf(g,s,t,ph){const f=.06*Math.sin(w*4*t+ph);
 g.beginPath();g.moveTo(-s,0);g.quadraticCurveTo(-s*.1,-s*(.62+f),s,0);g.quadraticCurveTo(-s*.1,s*(.62+f),-s,0);g.fillStyle="#8aa583";g.fill();
 g.beginPath();g.moveTo(-s,0);g.quadraticCurveTo(-s*.1,s*(.62+f),s,0);g.closePath();g.fillStyle="#9fb897";g.fill();
 g.strokeStyle="#cddbc7";g.lineWidth=s*.05;g.beginPath();g.moveTo(-s,0);g.lineTo(s*.9,0);
 for(let k=0;k<3;k++){const x=-s*.5+k*s*.38;g.moveTo(x,0);g.lineTo(x+s*.22,-s*.3);g.moveTo(x,0);g.lineTo(x+s*.22,s*.3)}g.stroke()}

// ---------- layout (positions given on the old 1944×1760 grid, mapped to the virtual stage) ----------
const BIG=[["r",260,300,150,1,.3],["r",1700,330,170,-1,1.1],["r",1560,1480,160,1,2],["r",420,1420,190,-1,2.8],["r",980,1650,120,1,4],["r",1000,110,100,-1,5],
           ["s",160,820,170,1,.7],["s",1800,900,190,-1,1.9],["s",700,190,130,1,3.1],["s",1280,1580,140,-1,4.4],["s",1450,120,110,1,5.2],["s",470,1700,100,-1,.2]];
const FIX_LEAF=[[120,200,230,.6],[1840,160,240,2.4],[240,1560,250,-.9],[1760,1580,260,3.8],[980,40,200,1.57],[980,1730,210,-1.57],[60,900,220,.2],[1900,860,220,3]];
const FALL_L=Array.from({length:14},(_,k)=>[k/14,hash(k,1,2),70+hash(k,3,4)*60,k]);
const FALL_F=Array.from({length:8},(_,k)=>[k%2?"s":"r",(k+.5)/8,hash(k,5,6),64+hash(k,7,8)*40,k%2?1:-1]);
const put=(g,x,y,a,fn)=>{g.save();g.translate(x,y);g.rotate(a);fn(g);g.restore()};
const fall=(u0,t)=>{const u=(u0+t/T)%1;return[u,-220+u*(VH+440)]};
const gx=x=>x/1944*VW,gy=y=>y/1760*VH;

function sample(fn){
 ox.setTransform(1,0,0,1,0,0);ox.clearRect(0,0,oc.width,oc.height);
 ox.setTransform(K*SS/CW,0,0,K*SS/CH,0,0);fn(ox);
 const d=ox.getImageData(0,0,oc.width,oc.height).data,out=new Float32Array(COLS*ROWS*4),rw=oc.width*4;
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
  let r=0,g=0,b=0,a=0;
  for(let v=0;v<SS;v++)for(let u=0,p=(j*SS+v)*rw+i*SS*4;u<SS;u++,p+=4){const al=d[p+3];r+=d[p]*al;g+=d[p+1]*al;b+=d[p+2]*al;a+=al}
  const o=(j*COLS+i)*4;if(a>0){out[o]=r/a;out[o+1]=g/a;out[o+2]=b/a;out[o+3]=a/(255*SS*SS)}}
 return out}

const RAMP="8%XSt;:",EDGE="',.o:;",SPR=["#c08a95","#d2c07a","#9a93b8","#8fae8a"];
function cells(L,depth,t){
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
  const o=(j*COLS+i)*4,a=L[o+3];if(a<.12)continue;
  const x=i*CW,y=j*CH;let c=[L[o],L[o+1],L[o+2]];if(depth)c=mix(c,BG,depth);
  const f=hash(i,j,Math.floor(t*4.2));
  if(a>.5){
   ctx.fillStyle=rgb(c);ctx.fillRect(x+1,y+1,CW-2,CH-2);
   const l=lum(c),ch=RAMP[Math.min(RAMP.length-1,Math.floor(l*6+f*4))];
   ctx.fillStyle=f<.03?SPR[(f*100)|0]:rgb(l<.4?mix(c,[255,255,255],.55):mix(c,[0,0,0],.5),depth?.7:1);
   ctx.fillText(ch,x+CW/2,y+CH/2+1);
  }else{ctx.fillStyle=rgb(c,Math.min(1,a*1.6));ctx.fillText(EDGE[(f*EDGE.length)|0],x+CW/2,y+CH/2+1)}}}

function draw(t){
 t=((t%T)+T)%T;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(bg,0,0);
 ctx.font=`500 ${Math.round(CW*.94)}px "Geist Mono",monospace`;ctx.textAlign="center";ctx.textBaseline="middle";
 // drifting glyph shimmer over the paper
 for(let j=0;j<ROWS;j++)for(let i=0;i<COLS;i++){
  const v=Math.sin(i*.176+j*.11+w*2*t)+Math.sin(-i*.112+j*.264-w*3*t)+Math.sin(i*.144-j*.176+w*4*t+Math.sin(i*.064+j*.088+w*t));
  if(v>1.2){const k=Math.min(1,(v-1.2)/1.5);ctx.fillStyle=`rgba(110,130,105,${.08+.22*k})`;ctx.fillText(k>.6?"*":k>.3?"+":"·",i*CW+CW/2,j*CH+CH/2)}}
 // back layer: leaves
 cells(sample(g=>{
  FIX_LEAF.forEach(([x,y,s,r],k)=>put(g,gx(x)+30*Math.sin(w*t+k),gy(y)+24*Math.cos(w*2*t+k),r+.25*Math.sin(w*2*t+k),q=>leaf(q,s,t,k)));
  FALL_L.forEach(([u0,x0,s,k])=>{const[u,y]=fall(u0,t);put(g,x0*VW+u*400-200+70*Math.sin(w*3*t+k),y,k+.9*Math.sin(w*3*t+k),q=>leaf(q,s,t,k))});
 }),.5,t);
 // front layer: roses and sunflowers
 cells(sample(g=>{
  BIG.forEach(([kd,x,y,s,dir,ph])=>put(g,gx(x)+70*Math.sin(w*t+ph),gy(y)+55*Math.cos(w*2*t+ph),ph+dir*w*t*(kd==="s"?2:1),q=>(kd==="s"?sun:rose)(q,s,t)));
  FALL_F.forEach(([kd,u0,x0,s,dir])=>{const[u,y]=fall(u0,t);put(g,x0*VW+u*500-250+60*Math.sin(w*3*t+u0*9),y,u0*6+dir*w*t*2,q=>(kd==="s"?sun:rose)(q,s,t))});
 }),.2,t);
}

const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
setup();
addEventListener("resize",()=>{setup();if(still)draw(6)});
if(still)draw(6);
else{const t0=performance.now();const loop=n=>{draw((n-t0)/1000);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
</script>
</body>
</html>
