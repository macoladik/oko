    <script type="text/babel">
      (() => {
        const { useEffect, useRef, useState } = React;
        const { motion } = window.Motion;
        const FADE_MS = 500;
        const FADE_OUT_LEAD = 0.55;

        function BlurText({ text, className = "" }) {
          const containerRef = useRef(null);
          const [visible, setVisible] = useState(false);
          const words = text.split(" ");

          useEffect(() => {
            const node = containerRef.current;
            if (!node) return undefined;

            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting && entry.intersectionRatio >= 0.1) {
                    setVisible(true);
                    observer.disconnect();
                  }
                });
              },
              { threshold: [0.1] }
            );

            observer.observe(node);

            return () => observer.disconnect();
          }, []);

          return (
            <p
              ref={containerRef}
              className={className}
              style={{
                display: "flex",
                flexWrap: "wrap",
                justifyContent: "center",
                rowGap: "0.1em",
              }}
            >
              {words.map((word, index) => (
                <motion.span
                  key={`${word}-${index}`}
                  style={{ display: "inline-block", marginRight: "0.28em" }}
                  initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
                  animate={
                    visible
                      ? {
                          filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                          opacity: [0, 0.5, 1],
                          y: [50, -5, 0],
                        }
                      : undefined
                  }
                  transition={{
                    duration: 0.7,
                    times: [0, 0.5, 1],
                    ease: "easeOut",
                    delay: (index * 100) / 1000,
                  }}
                >
                  {word}
                </motion.span>
              ))}
            </p>
          );
        }

        function FadingVideo({ src, className = "", style = {} }) {
          const videoRef = useRef(null);
          const rafRef = useRef(null);
          const fadingOutRef = useRef(false);

          useEffect(() => {
            const video = videoRef.current;
            if (!video) return undefined;

            const getOpacity = () => {
              const value = parseFloat(video.style.opacity || "0");
              return Number.isNaN(value) ? 0 : value;
            };

            const cancelFade = () => {
              if (rafRef.current !== null) {
                cancelAnimationFrame(rafRef.current);
                rafRef.current = null;
              }
            };

            const fadeTo = (target, duration = FADE_MS) => {
              cancelFade();
              const startOpacity = getOpacity();
              const delta = target - startOpacity;
              const startTime = performance.now();

              const step = (now) => {
                const progress = Math.min((now - startTime) / duration, 1);
                video.style.opacity = String(startOpacity + delta * progress);

                if (progress < 1) {
                  rafRef.current = requestAnimationFrame(step);
                } else {
                  video.style.opacity = String(target);
                  rafRef.current = null;
                }
              };

              rafRef.current = requestAnimationFrame(step);
            };

            const safePlay = () => {
              const result = video.play();
              if (result && typeof result.catch === "function") {
                result.catch(() => {});
              }
            };

            const handleLoadedData = () => {
              video.style.opacity = "0";
              safePlay();
              fadeTo(1, FADE_MS);
            };

            const handleTimeUpdate = () => {
              if (fadingOutRef.current || !video.duration) return;
              const remaining = video.duration - video.currentTime;
              if (remaining <= FADE_OUT_LEAD && remaining > 0) {
                fadingOutRef.current = true;
                fadeTo(0, FADE_MS);
              }
            };

            const handleEnded = () => {
              video.style.opacity = "0";
              window.setTimeout(() => {
                video.currentTime = 0;
                safePlay();
                fadingOutRef.current = false;
                fadeTo(1, FADE_MS);
              }, 100);
            };

            video.addEventListener("loadeddata", handleLoadedData);
            video.addEventListener("timeupdate", handleTimeUpdate);
            video.addEventListener("ended", handleEnded);

            return () => {
              cancelFade();
              video.removeEventListener("loadeddata", handleLoadedData);
              video.removeEventListener("timeupdate", handleTimeUpdate);
              video.removeEventListener("ended", handleEnded);
            };
          }, [src]);

          return (
            <div className="video-shell absolute inset-0 overflow-hidden">
              <video
                ref={videoRef}
                className={className}
                style={{ ...style, opacity: 0 }}
                src={src}
                autoPlay
                muted
                playsInline
                preload="auto"
              />
            </div>
          );
        }

        window.BlurText = BlurText;
        window.FadingVideo = FadingVideo;
      })();
    </script>

            <section

              className="relative flex min-h-screen flex-col overflow-hidden bg-black"
            >
              <FadingVideo
                src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
                className="absolute inset-0 z-0 h-full w-full object-cover"
              />

              <div className="relative z-10 flex min-h-screen flex-col px-4 pb-10 pt-20 sm:px-8 sm:pt-24 md:px-16 lg:px-20">
                <div className="mb-auto">
                  <motion.p
                    {...motionIn}
                    className="mb-6 text-sm font-body text-white/80"
                  >
                    // Capabilities
                  </motion.p>
                  <motion.h2
                    {...motionIn}
                    transition={{ ...motionIn.transition, delay: 0.1 }}
                    className="font-heading text-[3.8rem] italic leading-[0.9] tracking-[-2px] text-white sm:text-6xl sm:tracking-[-3px] md:text-7xl lg:text-[6rem]"
                  >
                    Production
                    <br />
                    evolved
                  </motion.h2>

                  <div className="mt-12 grid grid-cols-1 gap-6 sm:mt-16 md:grid-cols-3">
                    {capabilityCards.map((card, index) => (
                      <CapabilityCard key={card.title} card={card} index={index} />
                    ))}
                  </div>
                </div>
              </div>
            </section>
          );
        }

        function App() {
          return (
            <main className="bg-black text-white">
              <HeroSection />
              <CapabilitiesSection />
            </main>
          );
        }

        window.StatCard = StatCard;
        window.Navbar = Navbar;
        window.HeroSection = HeroSection;
        window.CapabilityCard = CapabilityCard;
        window.CapabilitiesSection = CapabilitiesSection;
        window.App = App;
      })();
    </script>

    <script type="text/babel">
      ReactDOM.createRoot(document.getElementById("root")).render(<window.App />);
    </script>
  </body>
</html>
